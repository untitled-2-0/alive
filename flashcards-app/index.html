<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall — Flashcards</title>
    <!-- Tailwind Play CDN: local preview only. In a claude.ai artifact Tailwind is already available. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fasting-вкладка: Manrope для тексту, Mulish для великих цифр (лише там, решта апки — системний шрифт) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; }
      /* Studying-редизайн: тонка поява картки/стрічки й пульс вогника стріку */
      @keyframes sc-rise { from { transform: translateY(8px); opacity: 0; } }
      @keyframes sc-pop { 0% { transform: scale(.94); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes sc-flamePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

      /* Медицина → «Як працює мозок»: нервовий імпульс і синапс.
         Імпульс стрибає між перехватами Ранв'є, тому рух ступінчастий, а не рівний. */
      @keyframes nrn-travel {
        0%   { transform: translateX(0);    opacity: 0; }
        4%   { opacity: 1; }
        96%  { opacity: 1; }
        100% { transform: translateX(430px); opacity: 0; }
      }
      @keyframes nrn-node   { 0%, 100% { r: 5; opacity: .25; } 50% { r: 9; opacity: 1; } }
      @keyframes nrn-soma   { 0%, 100% { opacity: .15; } 25% { opacity: .55; } }
      @keyframes syn-vesicle { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(26px, 38px); opacity: 0; } }
      @keyframes syn-cross   { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(58px); opacity: 0; } }
      @keyframes syn-recv    { 0%, 60% { opacity: .2; } 80% { opacity: 1; } 100% { opacity: .2; } }
      @media (prefers-reduced-motion: reduce) {
        [class*="nrn-"], [class*="syn-"] { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
